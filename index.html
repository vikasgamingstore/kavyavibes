<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAID FUN - Join Telegram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d18;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: #151d30;
      border: 1px solid #263b62;
      border-radius: 20px;
      box-shadow: 0 10px 40px #0008;
    }

    h1 {
      color: #55aaff;
      font-size: 30px;
    }

    p {
      color: #c5cee0;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #087bff, #704cff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>PAID FUN</h1>

    <p>
      Welcome! Click the button below to continue
      to our private Telegram channel.
    </p>

    <button id="joinButton">
      Continue to Telegram
    </button>

    <div id="status"></div>
  </div>

  <script>
    const button = document.getElementById("joinButton");
    const statusBox = document.getElementById("status");

    function getCookie(name) {
      const match = document.cookie.match(
        new RegExp("(?:^|; )" + name + "=([^;]*)")
      );

      return match ? decodeURIComponent(match[1]) : null;
    }

    button.addEventListener("click", async function () {
      button.disabled = true;
      statusBox.textContent = "Please wait...";

      try {
        const params = new URLSearchParams(location.search);
        const fbclid = params.get("fbclid");

        let fbc = getCookie("_fbc");

        if (!fbc && fbclid) {
          fbc = "fb.1." + Date.now() + "." + fbclid;
        }

        const data = {
          fbclid: fbclid,
          fbc: fbc,
          fbp: getCookie("_fbp"),
          utm_source: params.get("utm_source"),
          utm_medium: params.get("utm_medium"),
          utm_campaign: params.get("utm_campaign"),
          utm_content: params.get("utm_content"),
          utm_term: params.get("utm_term"),
          landing_url: location.href,
          referrer: document.referrer || null
        };

        const response = await fetch("/api/create-invite", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.ok || !result.invite_link) {
          throw new Error(result.message || "Invite creation failed");
        }

        statusBox.textContent = "Opening Telegram...";

        location.href = result.invite_link;

      } catch (error) {
        console.error(error);

        statusBox.textContent =
          "Something went wrong. Please try again.";

        button.disabled = false;
      }
    });
  </script>

</body>
</html>
